name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-[RT]C[0-9]+'
  pull_request:

permissions: {}

jobs:
  release:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    uses: JacobPEvans/.github/.github/workflows/_release.yml@v1
    secrets:
      GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY: ${{ secrets.GH_ACTION_RELEASE_PLEASE_PRIVATE_KEY }}
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      checks: read

  pack-release:
    if: github.ref_type == 'tag' && github.event.repository.is_template == false
    permissions:
      contents: write
    uses: jpe-cribl/.github/.github/workflows/cribl-pack-release.yml@61d2fd7d5238da5b01ff7f8e3f440139ec2345fe # main
